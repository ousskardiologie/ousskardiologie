<style>
  :root{

  *{box-sizing:border-box}

    background:radial-gradient(rgba(67,54,32,.05) 1px, transparent 1.2px) 0 0/23px 23px, linear-gradient(180deg,var(--paper),var(--paper2));

  .box{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 18px rgba(74,60,38,.12);
    padding:38px 40px 34px; max-width:400px; width:100%; text-align:center; }
  .eyebrow{ font-size:10.5px; letter-spacing:2.4px; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }

  h1 em{ font-style:italic; color:var(--red); }
  .lock{ font-size:30px; margin:8px 0 2px; }
  p.sub{ color:var(--ink-soft); font-size:13.5px; margin:6px 0 20px; }
  input{ width:100%; font-size:16px; padding:11px 14px; border:1.5px solid var(--line2); border-radius:9px;
    background:#fff; color:var(--ink); text-align:center; letter-spacing:2px; outline:none; }
  input:focus{ border-color:var(--red); }
  button{ width:100%; margin-top:12px; font-size:14.5px; font-weight:700; letter-spacing:.4px; color:#fff;
    background:var(--red); border:1px solid var(--red-deep); border-radius:9px; padding:11px; cursor:pointer; }
  button:hover{ background:var(--red-deep); }
  button:disabled{ opacity:.6; cursor:wait; }
  .err{ color:var(--red); font-size:13px; font-weight:600; margin-top:12px; min-height:18px; }
  .foot{ margin-top:18px; font-size:11px; color:var(--ink-faint); }
  .shake{ animation:sh .35s; }
  @keyframes sh{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
</style>

<script>
(function(){
  "use strict";
  var data = JSON.parse(document.getElementById('payload').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), btn = document.getElementById('btn'),
      box = document.getElementById('box');

  function b64(s){ var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }

  async function unlock(pass){
    var enc = new TextEncoder();
    var keyMat = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(data.salt), iterations:data.iter, hash:'SHA-256' },
      keyMat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(data.nonce) }, key, b64(data.ct));
    return new TextDecoder().decode(plain);
  }

  function show(html){
    document.open(); document.write(html); document.close();
  }

  f.addEventListener('submit', function(e){
    e.preventDefault();
    err.textContent = '';
    if(!window.crypto || !crypto.subtle){ err.textContent = 'Browser nicht unterstützt (HTTPS nötig).'; return; }
    btn.disabled = true; btn.textContent = 'Entschlüssle …';
    unlock(pw.value).then(function(html){
      try{ sessionStorage.setItem('diastola_mb', pw.value); }catch(_){}
      show(html);
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Entsperren';
      err.textContent = 'Falscher Code.';
      pw.value=''; pw.focus();
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    });
  });

  // Auto-Unlock innerhalb derselben Browser-Sitzung
  try{
    var saved = sessionStorage.getItem('diastola_mb');
    if(saved){ unlock(saved).then(show).catch(function(){ sessionStorage.removeItem('diastola_mb'); }); }
  }catch(_){}
})();
</script>
