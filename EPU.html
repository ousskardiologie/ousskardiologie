 */const Ev=Ue("ZoomIn",[["circle",{cx:"11",cy:"11",r:"8",key:"4ej97u"}],["line",{x1:"21",x2:"16.65",y1:"21",y2:"16.65",key:"13gj7c"}],["line",{x1:"11",x2:"11",y1:"8",y2:"14",key:"1vmskp"}],["line",{x1:"8",x2:"14",y1:"11",y2:"11",key:"durymu"}]]),yn=[{id:"sinus",short:"Sinusrhythmus",name:"Normale Erregungsleitung",group:"Grundlagen",rate:75,qrs:90,tag:"Der elektrische Ausgangspunkt",memory:"Ein Taktgeber. Ein geordneter Weg. Ein Herzschlag.",simple:"Der Sinusknoten startet. Die Vorhöfe werden erregt, der AV-Knoten verzögert kurz. Das His-Purkinje-System verteilt den Impuls schnell auf beide Kammern.",mechanism:"Spontane diastolische Depolarisation im Sinusknoten erzeugt den Impuls. Die atriale Ausbreitung bildet die P-Welle. AV-nodale Verzögerung und His-Purkinje-Leitung gehören zum PR-Intervall. Die Kammerdepolarisation bildet den QRS; ihre Repolarisation die T-Welle. Elektrische und mechanische Aktivität sind zeitlich versetzt.",criteria:["P vor jedem QRS, konstante 1:1-Überleitung","Sinus-P typischerweise positiv in I und II, negativ in aVR","PR 120–200 ms; QRS <120 ms"],differential:"Eine sinusähnliche P-Welle beweist keinen Sinusursprung: Eine FAT nahe dem Sinusknoten kann ähnlich aussehen.",epu:"A → H → V. Orientierende Ruhewerte: AH 50–120 ms, HV 35–55 ms. Das PR-Intervall umfasst zusätzlich die intraatriale Leitung; es ist nicht mit AH gleichzusetzen.",darija:"تخيّل القلب كيما دار فيها الضو. Sinusknoten هو لي يبدا الإشارة، AV-Knoten يحبسها شوية، ومن بعد His–Purkinje يوزّعها بسرعة للبطينين.",why:{"P-Welle":"Sinusknoten → Vorhofmyokard → mittlerer Vektor nach links und unten → positive P-Welle in II. Die Sinusknotenentladung selbst ist im Oberflächen-EKG nicht sichtbar.","PR-Intervall":"Vom Beginn der Vorhoferregung bis zum Beginn der Kammererregung. Im AV-Knoten ist die Leitung langsam. Ein verlängertes PR kann aber auch intraatrial oder im His-Purkinje-System entstehen.","QRS-Komplex":"Beide Kammern werden über das His-Purkinje-Netz nahezu gleichzeitig aktiviert. Die schnelle Ausbreitung erzeugt einen schmalen QRS.","T-Welle":"Die Rückbildung des Aktionspotenzials verändert die Spannungsunterschiede im Ventrikel. Eine Repolarisationsfront hat gegenüber einer Depolarisationsfront umgekehrte elektrische Polarität."},therapy:"normal"}],ct=c=>yn.find(h=>h.id===c)??yn[0],At=c=>yn.push(c);At({id:"avnrt",short:"AVNRT",name:"AV-Knoten-Reentrytachykardie",group:"Reentry & Präexzitation",rate:185,qrs:90,tag:"Zwei Leitungsbahnen. Ein sich selbst erhaltender Kreis.",memory:"AVNRT = eine Erregungswelle kreist im Bereich des AV-Knotens.",simple:"Ein zu früher Vorhofimpuls trifft die schnelle Bahn noch unerregbar. Er läuft die langsame Bahn hinunter. Unten angekommen kann er über die inzwischen erholte schnelle Bahn zurücklaufen. Dieselbe Erregungswelle kreist fortlaufend; Abzweigungen aktivieren Vorhöfe und Ventrikel. Es entsteht nicht bei jeder Runde ein neuer Fokusimpuls.",mechanism:"Typische Slow-fast-AVNRT: antegrade langsame und retrograde schnelle AV-nodale Leitung. Die schnelle Bahn besitzt im klassischen Initiationsmodell eine längere antegrade Refraktärzeit. Vorhof und Ventrikel werden nahezu gleichzeitig erregt; sie sind keine zwingenden Bestandteile des nodalen Kreises. Der Sinusknoten ist nicht ausgeschaltet, kann aber durch retrograde Erregung zurückgesetzt oder übersteuert werden. Seine Automatie ist nicht mit einem unabhängigen, ungestörten 70/min-Takt gleichzusetzen. Atypische Fast-slow- und Slow-slow-Formen haben eine spätere retrograde Vorhoferregung und häufig ein langes RP.",criteria:["Regelmäßige, meist schmale Tachykardie","P oft im QRS verborgen; möglich: Pseudo-r′ in V1, Pseudo-S inferior","Typisch kurzes RP; atypische Formen mit langem RP möglich"],differential:"AVRT, FAT mit langem PR und Vorhofflattern mit fester Überleitung. Kurzes RP oder eine verborgene P-Welle allein beweisen AVNRT nicht.",epu:"AH-Sprung: ≥50 ms AH-Zunahme bei Verkürzung des atrialen Extrastimulus-Kopplungsintervalls um 10 ms (klassische Definition). Echo-Schlag und Induzierbarkeit stützen den Mechanismus; duale Physiologie allein beweist keine klinische AVNRT. Typisch kurze septale VA-Zeit. Modifikation der langsamen Bahn; junktionaler Rhythmus kann während der Ablation auftreten, ist allein kein Endpunkt.",darija:"AVNRT كيما rond-point في AV-Knoten. كاين طريق بطيء وطريق سريع. الإشارة تدور وترجع وحدها. Adenosin يقطع الطريق للحظة، والحلقة تحبس.",why:{"P-Welle":"Retrograde Vorhof- und antegrade Kammeraktivierung liegen zeitlich eng beieinander. Die kleine P-Welle wird vom großen QRS überlagert oder verformt dessen Ende.","QRS-Komplex":"AV-nodaler Kreis → His-Purkinje-System → schnelle Kammererregung → meist schmaler QRS. Die Nähe der P-Welle kann in V1 ein kleines terminales r′ erzeugen.","PR-Intervall":"Während typischer AVNRT ist RP meist sehr kurz. Die sichtbare P-Welle gehört zur retrograden Erregung, nicht zu einem normalen Sinus-PR.","T-Welle":"Bei schnellem Rhythmus überlappen Repolarisation und die folgenden elektrischen Ereignisse. ST-Senkungen beweisen hier für sich allein keine Ischämie."},therapy:"svt"});At({id:"avrt",short:"Orthodrome AVRT",name:"Orthodrome AV-Reentrytachykardie",group:"Reentry & Präexzitation",rate:180,qrs:90,tag:"Durch den AV-Knoten hin. Über die akzessorische Bahn zurück.",memory:"Orthodrom: AV-Knoten runter, Zusatzbahn hoch → meist schmaler QRS.",simple:"Die Erregung erreicht die Kammer normal über AV-Knoten und His-Purkinje. Eine zusätzliche Verbindung bringt sie zurück zum Vorhof. Von dort läuft der nächste Umlauf los.",mechanism:"Makro-Reentry unter obligater Beteiligung von Vorhof, AV-Knoten/His-Purkinje, Ventrikel und retrograd leitender akzessorischer Bahn. Auch eine ausschließlich retrograd leitende, verborgene Bahn kann AVRT ermöglichen: Im Sinusrhythmus fehlt dann die Delta-Welle.",criteria:["Regelmäßige, meist schmale Tachykardie","Retrograde P-Welle häufig nach dem QRS, RP oft länger als bei typischer AVNRT","Bei funktioneller Aberranz kann auch orthodrome AVRT breit sein"],differential:"AVNRT; FAT. RP-Länge und P-Morphologie überlappen. Oberflächen-EKG legt Verdacht nahe, EPU klärt die Bahn und ihre Beteiligung.",epu:"VA-Sequenz und ventrikuläre Stimulation prüfen die retrograde Bahnleitung. Eine His-refraktäre VES, die das folgende A vorverlegt oder die Tachykardie ohne A terminiert, kann die Beteiligung einer Bahn belegen; Interpretation benötigt den gesamten EGM-Kontext. Frühes lokales A hilft bei der Lokalisation.",darija:"الإشارة تهبط بالطريق العادي AV-Knoten، توصل للبطين، ومن بعد ترجع للفوق بطريق زايد. هكذا تدور بين الأذين والبطين.",why:{"P-Welle":"Ventrikel → retrograde Zusatzbahn → Vorhof → häufig negative P-Welle inferior. Der Ort der Bahn verändert die Vorhofvektoren.","QRS-Komplex":"Die antegrade Leitung verwendet His und Purkinje. Beide Kammern werden schnell aktiviert; daher meist schmaler QRS, obwohl eine Zusatzbahn am Kreis beteiligt ist.","PR-Intervall":"Das RP entspricht grob dem Weg zurück zum Vorhof; das folgende PR enthält die erneute antegrade Leitung. Ein Zahlenwert allein trennt AVRT nicht sicher von AVNRT."},therapy:"svt"});At({id:"antidrom",short:"Antidrome AVRT",name:"Antidrome AV-Reentrytachykardie",group:"Reentry & Präexzitation",rate:175,qrs:170,tag:"Die Zusatzbahn übernimmt die antegrade Leitung.",memory:"Antidrom: Zusatzbahn runter, AV-Knoten hoch → breiter QRS.",simple:"Die Zusatzbahn erregt die Kammer direkt. Der Impuls muss zunächst langsam durch Muskelgewebe laufen und kehrt über das normale Leitungssystem zum Vorhof zurück.",mechanism:"Antegrade Leitung über die akzessorische Bahn, retrograde Rückleitung typischerweise über His-Purkinje und AV-Knoten; selten ist eine zweite Bahn beteiligt. Die frühe Kammererregung außerhalb des normalen Netzes verbreitert den QRS.",criteria:["Regelmäßige Breitkomplextachykardie","Vollständige Präexzitation während der Tachykardie","Retrograde P-Wellen können von QRS/ST/T überlagert sein"],differential:"Insbesondere VT; daneben SVT mit Aberranz. Eine breite regelmäßige Tachykardie darf nicht allein wegen jungen Alters als antidrome AVRT gelten.",epu:"Nachweis antegrader Bahnleitung, retrograder Rückleitung und obligater Bahnbeteiligung. Mapping am AV-Ring lokalisiert die Verbindung; Bahnblock unterbricht den Kreis.",darija:"هنا الإشارة تهبط بالطريق الزايد قبل الشبكة السريعة. البطين يتنبه شوية بشوية، لهذا QRS يبان عريض.",why:{"QRS-Komplex":"Akzessorische Bahn → lokales Kammermyokard → langsame Ausbreitung vor Rekrutierung des Netzes → breiter präexzitierter QRS.","P-Welle":"Die Vorhöfe werden retrograd erregt. Wegen breitem QRS und hoher Frequenz kann das A-Signal im Oberflächen-EKG verdeckt sein."},therapy:"preaf"});At({id:"wpw",short:"WPW / Präexzitation",name:"WPW und ventrikuläre Präexzitation",group:"Reentry & Präexzitation",rate:75,qrs:130,tag:"Zwei Wege zum Ventrikel. Einer kommt zu früh an.",memory:"Delta = früher Muskelstart vor dem schnellen Verteilernetz.",simple:"Ein Sinusimpuls teilt sich auf: Der normale Weg wartet im AV-Knoten, die Zusatzbahn erreicht bereits einen Teil der Kammer. Diese frühe, langsame Erregung zeichnet die Delta-Welle.",mechanism:"Die Fusion aus vorzeitiger myokardialer Aktivierung über die akzessorische Bahn und späterer His-Purkinje-Aktivierung erzeugt variable Präexzitation. WPW-Muster bezeichnet die typische EKG-Präexzitation ohne zugehörige symptomatische Tachyarrhythmie; WPW-Syndrom die Kombination mit klinischen Tachyarrhythmien. Eine akzessorische Bahn ist das anatomische Substrat; AVRT ist ein möglicher Reentry-Mechanismus. Diese Begriffe sind nicht gleichbedeutend.",criteria:["Typisch PR <120 ms, Delta-Welle und verbreiterter QRS","Präexzitation kann diskret oder intermittierend sein","Eine verborgen nur retrograd leitende Bahn erzeugt keine Delta-Welle"],differential:"Schenkelblock, unspezifische Leitungsverzögerung und andere Ursachen kurzer PR-Zeit. Fehlende Delta-Welle schließt eine retrograd leitende Bahn nicht aus.",epu:"Antegrade Refraktärität und Überleitungseigenschaften der Bahn bestimmen das Risiko. SPERRI ≤250 ms bei präexzitiertem VHF ist ein wichtiges Hochrisikomerkmal. Oberflächenmuster kann eine Region vermuten lassen; definitive Lokalisation im Mapping.",darija:"WPW: كاين raccourci. الإشارة تفوت AV-Knoten وتوصل بكري للبطين. البداية البطيئة هذي هي Delta. وجود الطريق وحدو ما يعنيش بلي كاين دائمًا tachycardie.",why:{"QRS-Komplex":"Zusatzbahn → früher kleiner Muskelbezirk → langsamer Spannungsanstieg = Delta; anschließend Fusion mit His-Purkinje-Erregung → insgesamt breiter QRS.","PR-Intervall":"Der Zusatzweg umgeht die normale AV-nodale Wartezeit. Der QRS beginnt früher nach dem P-Beginn.","P-Welle":"Im Sinusrhythmus bleibt der atriale Ursprung normal. Die Zusatzbahn verändert die Kammeraktivierung, nicht den Ursprung der Sinus-P-Welle."},therapy:"wpw"});At({id:"fat",short:"Fokale atriale Tachykardie",name:"Fokale atriale Tachykardie · FAT",group:"Atriale Arrhythmien",rate:145,qrs:90,tag:"Ein ektoper Fokus bestimmt den Vorhoftakt.",memory:"FAT = ein falscher Taktgeber feuert im Vorhof.",simple:"Ein einzelner Ort außerhalb des Sinusknotens startet immer wieder eine Erregungswelle. Von dort breitet sie sich durch die Vorhöfe aus. Der AV-Knoten leitet alle oder nur einen Teil der Impulse weiter.",mechanism:"Fokale atriale Tachykardien können durch gesteigerte Automatie, getriggerte Aktivität oder lokalisierte Reentry entstehen. Zentrifugale atriale Aktivierung erzeugt eine reproduzierbare, vom Fokus abhängige P-Welle. Automatische Formen zeigen oft Beschleunigung/Verlangsamung (Warm-up/Cool-down), andere können abrupt beginnen. Adenosin kann nur die AV-Überleitung blockieren, aber bestimmte getriggerte oder adenosinsensitive Formen auch terminieren.",criteria:["Meist regelmäßige atriale Aktivität; monomorphe ektopische P-Wellen","1:1-, 2:1- oder variable AV-Überleitung; RP/PR abhängig von Frequenz und Leitung","Zwischen P-Wellen häufig isoelektrische Linie; kein absoluter Ausschluss von Makro-Reentry"],differential:"Sinusnahe FAT kann Sinustachykardie imitieren. Überlagerte P-Wellen oder 2:1-Leitung ähneln Flattern; variable Überleitung kann VHF vortäuschen. Eine organisierte Vorhofaktivität suchen, EPU bei unklarem Mechanismus oder Ablationsplanung.",epu:"Aktivierungsmapping sucht das früheste reproduzierbare lokale A vor dem Oberflächen-P; zentrifugale Sequenz und lokales EGM zusammen bewerten. Frühestes Signal ist nicht automatisch der sicherste Ablationsort. Para-His: AV-Block-Risiko. SVC/Sinusknotennähe: Sinusknotenverletzung und Phrenikusnähe; Phrenikusstimulation zeigt Nähe an und kann eine Ablation begrenzen.",darija:"FAT كيما واحد آخر شدّ خدمة Sinusknoten. غير نقطة وحدة راهي تبعث الإشارة. إذا حبّسنا AV-Knoten، الأذين يقدر يبقى يجري وحدو؛ ماشي لازم FAT تحبس.",why:{"P-Welle":"Tiefer Fokus am CS-Ostium → Vorhoferregung nach kranial → Vektor weg von den positiven inferioren Elektroden → negative P in II/III/aVF. Hoher rechter Fokus kann eine sinusähnliche P erzeugen. Die Form lokalisiert nur orientierend.","PR-Intervall":"Die Lage des Fokus bestimmt den Weg zum AV-Knoten. Frequenz, AV-Leitung und Refraktärität verändern PR und Überleitungsverhältnis.","QRS-Komplex":"Der Fokus sitzt im Vorhof. Bei normaler AV-/His-Purkinje-Leitung bleibt die Kammererregung schmal; bei 2:1 kommt auf zwei A nur ein QRS."},therapy:"fat"});At({id:"mat",short:"Multifokale atriale Tachykardie",name:"Multifokale atriale Tachykardie · MAT",group:"Atriale Arrhythmien",rate:130,qrs:90,tag:"Mehrere Ursprünge. Erkennbare P-Wellen. Unregelmäßiger Takt.",memory:"MAT = mehrere ektopische Taktgeber wechseln sich ab.",simple:"Mehrere Vorhoforte übernehmen abwechselnd den Takt. Jeder erzeugt eine andere P-Welle. Zwischen den einzelnen Erregungen kehrt das EKG zur Grundlinie zurück.",mechanism:"Mindestens drei verschiedene P-Morphologien in derselben Ableitung, unregelmäßige PP-, PR- und RR-Abstände und atriale Frequenz >100/min kennzeichnen MAT. Im Modell ist auch die mittlere Kammerfrequenz >100/min. Mehrere automatische Vorhofursprünge konkurrieren; die Ausbreitung pro Schlag bleibt organisiert. Häufig bei akuter Lungenerkrankung, Hypoxämie oder Elektrolytstörung.",criteria:["≥3 P-Wellen-Morphologien in einer Ableitung","Unregelmäßige PP-, PR- und RR-Intervalle","Isoelektrische Strecken zwischen P; Frequenz >100/min"],differential:"VHF hat keine konsistent diskreten P-Wellen; bei MAT sind einzelne P und isoelektrische Pausen erkennbar. Flattern mit variabler Überleitung hat weiterhin eine regelmäßige atriale Flatteraktivität.",epu:"Unterschiedliche früheste atriale Aktivierungsorte und wechselnde Sequenzen. EPU ist zur typischen MAT-Diagnose meistens nicht erforderlich; kein einzelner stabiler Fokus als Standard-Ablationsziel.",darija:"MAT ماشي VHF. هنا كاين عدة نقاط، كل مرة وحدة تبعث إشارة منظمة وP مختلفة. بيناتهم الخط يرجع مستقيم. في VHF ما تلقاش P منظمة.",why:{"P-Welle":"Wechselnder Ursprung → wechselnde Richtung des Vorhofvektors → mindestens drei P-Formen. Negative P ist eine Richtungsaussage, kein Zeichen fehlender Vorhofaktivität.","PR-Intervall":"Fokusort und wechselnde AV-nodale Erholung verändern die Zeit bis zur Kammeraktivierung.","QRS-Komplex":"Die Vorhoftakte sind unregelmäßig; das normale His-Purkinje-System kann trotzdem jeden übergeleiteten Impuls schmal verteilen."},therapy:"mat"});At({id:"af",short:"Vorhofflimmern",name:"Vorhofflimmern · VHF",group:"Atriale Arrhythmien",rate:125,qrs:90,tag:"Ungeordnete Vorhöfe. Ein AV-Knoten als wechselnder Filter.",memory:"VHF = kein gemeinsamer Vorhoftakt, kein festes RR-Muster.",simple:"Viele Erregungswellen laufen gleichzeitig durch die Vorhöfe. Nicht jede erreicht die Kammer. Der AV-Knoten lässt die Impulse in unvorhersehbaren Abständen durch.",mechanism:"Trigger, häufig aus den Pulmonalvenen, und ein geeignetes atriales Substrat ermöglichen fibrillatorische Aktivität. Wechselnde AV-nodale Refraktärität und verborgene Leitung erzeugen die absolute Arrhythmie. Paroxysmal: Terminierung innerhalb von 7 Tagen. Persistierend: kontinuierlich >7 Tage. Lang anhaltend persistierend: ≥12 Monate bei weiter angestrebter Rhythmuskontrolle. Permanent: gemeinsam akzeptiertes VHF ohne weitere Rhythmuskontrollversuche; eine Therapieentscheidung, keine reine Zeitkategorie.",criteria:["Keine regelmäßig wiederkehrenden organisierten P-Wellen","Unregelmäßig-unregelmäßige RR-Abstände bei erhaltener AV-Überleitung","Fein- oder grobwellige Grundlinie; Flimmerwellen können kaum erkennbar sein"],differential:"MAT, Flattern mit variabler Überleitung, häufige Extrasystolen. Bei komplettem AV-Block oder Ventrikelstimulation kann VHF einen regelmäßigen Kammerersatz-/Stimulationsrhythmus haben.",epu:"Transseptaler Zugang ermöglicht Zugang zum LA. PV-Potenziale belegen lokale elektrische Aktivität. PVI trennt PV-Muskulatur vom Vorhof: Eintrittsblock verhindert LA→PV, Austrittsblock PV→LA. Dissoziierte PV-Aktivität kann trotz isoliertem Vorhof weiterbestehen. Konsensus 2024: 8 Wochen Blanking-Periode; frühe Rezidive sind nicht automatisch dauerhaftes Versagen, spätere oder wiederholte Ereignisse erhöhen aber den Rezidivverdacht.",darija:"في VHF الأذين كيما جماعة كل واحد يهدر وحدو. AV-Knoten يخلّي غير بعض الإشارات تعدّي. لهذا المسافة بين ضربات البطين تتبدل بلا نظام.",why:{"P-Welle":"Viele zeitlich und räumlich wechselnde Vorhofvektoren summieren sich nicht zu einer gemeinsamen P-Welle. Stattdessen kleine, unregelmäßige Flimmerwellen oder fast flache Grundlinie.","QRS-Komplex":"Der AV-Knoten erholt sich unterschiedlich und wird durch nicht vollständig übergeleitete Impulse beeinflusst. Der nächste Kammerimpuls kommt daher ohne regelmäßiges RR-Schema.","PR-Intervall":"Ohne definierbaren P-Beginn gibt es kein regulär messbares PR-Intervall."},therapy:"af"});At({id:"flutter",short:"Typisches Vorhofflattern",name:"CTI-abhängiges Vorhofflattern",group:"Atriale Arrhythmien",rate:300,qrs:90,tag:"Eine große Schleife um den Trikuspidalannulus.",memory:"Typisches Flattern = atrialer Kreis mit Engstelle am CTI.",simple:"Ein Impuls läuft immer wieder um die Trikuspidalklappe. Der AV-Knoten leitet im Beispiel nur jeden zweiten Vorhofumlauf weiter: Vorhof 300/min, Kammer 150/min.",mechanism:"Bei typischem gegenläufigem CTI-Flattern läuft die Aktivierung septal nach kranial und an der freien rechten Vorhofwand nach kaudal. Der cavotrikuspidale Isthmus ist obligater Teil des Kreises. Vorhoffrequenz häufig 250–350/min; Medikamente oder Narben können sie verändern. 2:1-Überleitung kann eine scheinbar einfache regelmäßige schmale Tachykardie erzeugen.",criteria:["Regelmäßige atriale Flatterwellen, oft sägezahnartig","Bei typischem gegenläufigem Kreis meist negative Flatterwellen inferior, positiv in V1","2:1-Überleitung oft Kammerfrequenz um 150/min; variable Überleitung macht RR unregelmäßig"],differential:"FAT, atypische Makro-Reentry, VHF bei wechselnder AV-Leitung. Fehlende klassische Sägezähne schließen Flattern nicht aus; Morphologie beweist CTI-Abhängigkeit nicht.",epu:"Aktivierungsfolge um den Annulus und Entrainment prüfen den Kreis. Ein kurzes PPI minus Tachykardiezykluslänge am CTI unterstützt Kreisbeteiligung, ist kontextabhängig. CTI-Linie unterbricht den Weg; bidirektionaler Block wird als Endpunkt geprüft, Terminierung allein genügt nicht.",darija:"Flutter كيما واحد يجري داير بالحلقة حول الصمام الثلاثي. كل دورة تنبّه الأذين. AV-Knoten يقدر يمرّر غير دورة من زوج.",why:{"P-Welle":"Kontinuierliche Makro-Reentry erzeugt anhaltende, wiederkehrende atriale Vektoren: Flatterwellen statt isolierter P.","QRS-Komplex":"Der AV-Knoten wirkt als Filter. Bei 2:1 erscheinen zwei atriale Umläufe pro Kammerkomplex; bei wechselnder Blockierung variiert RR.","PR-Intervall":"Die sichtbare Vorhofaktivität kann mit QRS oder T verschmelzen. Ein scheinbares P-QRS-Paar darf nicht vorschnell als Sinusleitung gelten."},therapy:"flutter"});At({id:"rbbb",short:"Rechtsschenkelblock",name:"Rechtsschenkelblock · RBBB",group:"Kammerleitung & breite Tachykardien",rate:75,qrs:140,tag:"LV pünktlich. RV verspätet.",memory:"RBBB = LV pünktlich, RV kommt zu spät.",simple:"Der linke Schenkel funktioniert. Die linke Kammer startet normal; die rechte Kammer muss später über Muskelzellen von links her erregt werden.",mechanism:"Initiale Septum- und LV-Aktivierung bleiben weitgehend erhalten. Die verspätete RV-Aktivierung über langsamere myokardiale Leitung verlängert den QRS und erzeugt einen terminal rechts-anterior gerichteten Vektor. Sekundäre ST-T-Veränderungen zeigen sich insbesondere rechtspräkordial.",criteria:["Kompletter RBBB: QRS ≥120 ms","V1/V2 häufig rsR′ oder rSR′; nicht jede Form sieht wie ein perfektes M aus","Breite terminale S-Zacke in I und V6"],differential:"RV-Hypertrophie, Brugada-Muster, Präexzitation und ventrikuläre Rhythmen. Eine rsR′-Konfiguration allein genügt nicht für kompletten RBBB.",epu:"Verzögerte RV-Aktivierungsfolge; HV kann bei isoliertem RBBB normal sein. Synkope und zusätzliche Leitungsstörungen erfordern gezielte Abklärung.",darija:"الجهة اليسرى LV توصلها الإشارة في الوقت. اليمنى RV الطريق تاعها مسدود، فتستنى الإشارة تجيها من العضلة المجاورة. لهذا آخر QRS يتأخر.",why:{"QRS-Komplex":"Späte RV-Erregung → terminaler Vektor zur rechtspräkordialen V1-Elektrode → R′. Derselbe Vektor läuft von I/V6 weg → breite terminale S-Zacke.","T-Welle":"Die abnorme späte Depolarisation verändert die Repolarisationsfolge. ST/T ist häufig dem terminalen QRS-Anteil entgegengerichtet.","P-Welle":"Der isolierte Schenkelblock betrifft die Kammerleitung. Die atriale P-Welle kann normal bleiben."},therapy:"block"});At({id:"lbbb",short:"Linksschenkelblock",name:"Linksschenkelblock · LBBB",group:"Kammerleitung & breite Tachykardien",rate:75,qrs:160,tag:"Rechte Kammer zuerst. Die große linke Kammer folgt.",memory:"LBBB = RV zuerst, LV kommt verspätet.",simple:"Die linke Kammer erhält ihren schnellen Impuls nicht. Die Erregung kommt zunächst rechts an und breitet sich dann langsamer nach links aus.",mechanism:"Veränderte initiale Septumerregung von rechts nach links und verspätete LV-Aktivierung prägen den QRS. Der dominante spätere Vektor zeigt nach links und weg von V1. Die elektrische Dyssynchronie kann mit mechanischer Dyssynchronie einhergehen.",criteria:["Kompletter LBBB: QRS ≥120 ms","Breite, oft gekerbte R-Zacken in I, aVL, V5–V6; typischerweise keine normalen septalen q lateral","V1 überwiegend negativer QRS; sekundäre ST-T-Diskordanz"],differential:"Ventrikelstimulation, Präexzitation, VT oder unspezifische intraventrikuläre Leitungsstörung. Strengere LBBB-Definitionen für CRT unterscheiden sich von der Grunddiagnose.",epu:"Verzögerte linke Kammeraktivierung. Die Indikation zu CRT ergibt sich aus klinischem Gesamtbild, LVEF, Symptomen und QRS-Merkmalen, nicht allein aus der Grafik.",darija:"هنا اليمنى RV تبدا، واليسرى LV تستنى حتى تجيها الإشارة من اليمين. أغلب courant يمشي لليسار بعيد على V1، لذلك QRS في V1 غالبًا لتحت.",why:{"QRS-Komplex":"RV/Septum → langsame Ausbreitung nach links → großer später LV-Vektor weg von V1: tiefer negativer QRS. In I/aVL/V5/V6 zeigt er zur Elektrode und bildet ein breites, gekerbtes R.","T-Welle":"Veränderte Depolarisationsfolge → sekundäre Repolarisationsänderung. ST/T weist häufig entgegen dem Haupt-QRS. Auffällige Konkordanz kann bei passender Klinik an akute Ischämie denken lassen."},therapy:"block"});for(const[c,h,d]of[["af-rbbb","rbbb","Rechtsschenkelblock"],["af-lbbb","lbbb","Linksschenkelblock"]]){const o=ct(h);At({...o,id:c,short:`VHF + ${h.toUpperCase()}`,name:`Vorhofflimmern mit ${d}`,rate:135,tag:"Absolute Arrhythmie trifft auf verzögerte Kammerleitung.",memory:`VHF bestimmt das Wann; ${h.toUpperCase()} verändert das Wie der Kammererregung.`,simple:`Die Vorhöfe flimmern. Jeder übergeleitete Impuls trifft auf einen ${d}; deshalb sind die Abstände unregelmäßig und die QRS-Komplexe breit.`,mechanism:`${ct("af").mechanism.split(" Paroxysmal:")[0]} Dazu kommt eine vorbestehende oder frequenzabhängige Schenkelaberranz. Eine Lang-kurz-Sequenz kann funktionelle Aberranz begünstigen (Ashman-Phänomen, häufig RBBB), beweist sie jedoch nicht.`,criteria:["Unregelmäßig-unregelmäßige RR-Abstände","Keine organisierten P-Wellen",...o.criteria],differential:"Präexzitiertes VHF und VT mitdenken. Konstante typische Schenkelmorphologie stützt Aberranz; wechselnder Präexzitationsgrad und extrem kurze RR stützen eine Zusatzbahn. Kein Einzelzeichen garantiert die Diagnose.",epu:"Intrakardiale Signale helfen, supraventrikuläre Aktivierung mit verzögerter Kammerleitung von antegrader Bahnleitung oder ventrikulärem Ursprung abzugrenzen.",therapy:"af"})}At({id:"preaf",short:"Präexzitiertes VHF",name:"Präexzitiertes Vorhofflimmern",group:"Kammerleitung & breite Tachykardien",rate:240,qrs:170,tag:"Gefährliche Kombination: Vorhofflimmern und antegrade Zusatzbahn.",memory:"Unregelmäßig + breit + extrem schnell: präexzitiertes VHF mitdenken.",simple:"Viele Vorhofimpulse erreichen die Kammer über eine Zusatzbahn. Die Schutzwirkung des AV-Knotens wird teilweise umgangen. Extrem schnelle und wechselnd breite Kammerkomplexe können entstehen.",mechanism:"Eine antegrad leitende Bahn mit kurzer Refraktärzeit kann schnelle fibrillatorische Vorhofaktivität auf die Ventrikel übertragen. Wechselnde Fusion zwischen Bahn- und His-Purkinje-Leitung führt zu variabler QRS-Breite und -Morphologie. Sehr kurze präexzitierte RR-Abstände weisen auf gefährliche Leitungseigenschaften hin. Degeneration in Kammerflimmern ist möglich.",criteria:["Unregelmäßige Breitkomplextachykardie","Häufig wechselnde QRS-Breite und Morphologie durch variable Präexzitation","Extrem kurze RR möglich; SPERRI ≤250 ms ist ein Risikomerkmal"],differential:"VHF mit Aberranz, polymorphe VT. Unregelmäßig und breit bedeutet nicht automatisch supraventrikulär. EKG-Verdacht und sichere Akutstrategie gehen vor voreiliger Mechanismusfestlegung.",epu:"Nachweis einer antegrad leitenden Bahn und ihrer Refraktärität; SPERRI und Bahnleitungsparameter zur Risikobeurteilung. Definitive Behandlung des Substrats durch Bahnablation.",darija:"هذي خطيرة: الأذين راه يفليمر، والطريق الزايد يبعث بزاف إشارات للبطين بلا filtre تاع AV-Knoten. ما نعطيوش دواء يحبّس غير AV-Knoten، يقدر يزيد الخطر.",why:{"QRS-Komplex":"Chaotische Vorhofaktivität → unterschiedlich schnelle Bahnleitung und wechselnde Fusion → breite Komplexe mit wechselnder Form. Die Unregelmäßigkeit macht den Rhythmus nicht harmlos.","P-Welle":"Fibrillatorische Aktivität besitzt keinen gemeinsamen P-Vektor. Die Zusatzbahn verändert zusätzlich die Kammeraktivierung.","PR-Intervall":"Es gibt kein geordnetes P-QRS-Paar. Die Gefährdung beurteilt man unter anderem an kurzen präexzitierten RR, nicht an einem PR-Wert."},therapy:"preaf"});At({id:"vt",short:"Ventrikuläre Tachykardie",name:"Ventrikuläre Tachykardie · VT",group:"Kammerleitung & breite Tachykardien",rate:170,qrs:170,tag:"Der Impuls entsteht in der Kammer. Stabilität schließt VT nicht aus.",memory:"Unklare Breitkomplextachykardie: VT ernst nehmen.",simple:"Die Kammer erzeugt ihren eigenen schnellen Rhythmus. Die Vorhöfe können unabhängig davon im Sinustakt weiterlaufen. Das normale schnelle Leitungsnetz wird anders oder verspätet erreicht.",mechanism:"Monomorphe VT entsteht oft durch Reentry in Narbengewebe, kann aber auch fokal oder im His-Purkinje-System entstehen. AV-Dissoziation, Capture- und Fusionsschläge sowie passende Morphologiekriterien stützen VT; fehlende sichtbare AV-Dissoziation schließt VT nicht aus. Das Modell zeigt eine monomorphe VT mit unabhängigem Vorhoftakt, keine patientenspezifische VT-Lokalisation.",criteria:["Breite Tachykardie, monomorph meist regelmäßig","AV-Dissoziation, Capture/Fusion unterstützen VT","Polymorphe VT kann unregelmäßig sein; Stabilität beweist keinen SVT-Ursprung"],differential:"SVT mit Aberranz, antidrome AVRT, präexzitiertes VHF bei unregelmäßigen Komplexen. Bei struktureller Herzerkrankung ist VT besonders wahrscheinlich.",epu:"Ventrikuläre Aktivierung ist der Treiber; atriale Aktivität kann unabhängig sein oder retrograd folgen. Ak
